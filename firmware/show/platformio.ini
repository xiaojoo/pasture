; ESP32-S3 light-show aircraft -- one airframe of the ranch's drone show
;
; The choreography is baked offline by the ground station into one time-indexed
; path per aircraft and uploaded before the show. In flight nobody pilots: this
; firmware follows its own baked path with an RTK fix, drives its own two WS2812B
; pixels, and on any loss of position or of the ground link it returns to the one
; return slot that belongs to its own station number.
;
;   pio run -e esp32s3-show            # build for the shipping part
;   pio run -e esp32s3-show -t upload  # flash over USB-CDC
;   pio device monitor                 # 115200 8N1
;   pio test -e native                 # host unit tests for firmware/lib
;
; The browser build of the same source is generated by tools/bundle.mjs and the
; host sandbox by .probe/show.sh.

[platformio]
name = ranch-show
description = ESP32-S3 light-show aircraft (RTK path following + WS2812B)
default_envs = esp32s3-show

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Werror
    -DCORE_DEBUG_LEVEL=0
    -DRANCH_FW_VERSION=\"1.0.0\"
build_unflags =
    -std=gnu++11

[esp32_common]
platform = espressif32@6.12.0
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit NeoPixel@^1.12.0
lib_ldf_mode = chain+

[env:esp32s3-show]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_SHOW=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-show-wroom]
; Same firmware on the classic ESP32 (no PSRAM, and the WS2812 write has to share
; the older RMT peripheral with the infrared library -- this build is for the
; bench units that were wired before the S3 was picked).
extends = esp32_common
board = esp32dev
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_SHOW=1

[env:native]
; Host build of the platform-neutral logic only. No Arduino sources are
; compiled here; test/test_sandbox.cpp links the whole application instead, and
; .probe/show.sh is what runs it.
platform = native
build_flags = -std=c++17 -Wall -Werror -I../lib
src_filter = +<*.cpp>
