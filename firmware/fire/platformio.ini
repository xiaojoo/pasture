; 牧场消防监测板 · ESP32 DevKit V1
;
; Four supervised detector loops (house, barn, store room, switch room), a
; break-glass manual call point, a wet-pipe flow switch, the bell and strobe, the
; sprinkler pump permit, and an uplink that shouts when any of them changes.
;
;   pio run -e esp32-fire
;   pio run -e esp32-fire -t upload
;   pio device monitor
;   pio test -e native

[platformio]
name = ranch-fire
description = ESP32 ranch fire panel: supervised loops, cross-zone confirmation, dial-out
default_envs = esp32-fire

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Werror
    -DCORE_DEBUG_LEVEL=0
    -DRANCH_FW_VERSION=\"1.0.0\"
build_unflags =
    -std=gnu++11

[env:esp32-fire]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_FIRE=1

[env:esp32-fire-ttn]
; The same firmware dialling out over The Things Network instead of a local
; broker. A fire panel's uplink has to survive the ranch WiFi being off, which is
; why this env exists at all rather than being a nice idea.
extends = env:esp32-fire
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_FIRE=1
    -DRANCH_UPLINK_LORAWAN=1

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Werror -I../lib
src_filter = +<native/>
