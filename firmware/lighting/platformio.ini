; 牧场照明控制板 · ESP32 DevKit V1
;
; Astronomical switching for the yard perimeter, the house porch and a dimmed
; barn high bay. The board computes sunrise and sunset for its own coordinates,
; ramps the barn driver instead of stepping it, and treats a lamp that is commanded
; on but drawing no current as a fault rather than as a lamp that works.
;
;   pio run -e esp32-lighting
;   pio run -e esp32-lighting -t upload
;   pio device monitor
;   pio test -e native

[platformio]
name = ranch-lighting
description = ESP32 astronomical ranch lighting controller
default_envs = esp32-lighting

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Werror
    -DCORE_DEBUG_LEVEL=0
    -DRANCH_FW_VERSION=\"1.0.0\"
build_unflags =
    -std=gnu++11

[env:esp32-lighting]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_LIGHTING=1

[env:esp32-lighting-dali]
; Same firmware with the barn on a DALI bus instead of the 0-10 V driver.
extends = env:esp32-lighting
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_LIGHTING=1
    -DRANCH_DIM_DALI=1

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Werror -I../lib
src_filter = +<native/>
