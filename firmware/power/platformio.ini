; 牧场配电监测板 · ESP32 DevKit V1
;
; Three-phase switchboard monitor: per-phase volts and amps, frequency from a
; zero crossing on phase A, cabinet temperature and residual current on an
; external ADC, the main breaker's auxiliary contact, and the two contactors
; (water pump, yard lighting) that the shed/trip logic opens.
;
;   pio run -e esp32-power
;   pio run -e esp32-power -t upload
;   pio device monitor
;   pio test -e native

[platformio]
name = ranch-power
description = ESP32 ranch switchboard monitor and load shedder
default_envs = esp32-power

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Werror
    -DCORE_DEBUG_LEVEL=0
    -DRANCH_FW_VERSION=\"1.0.0\"
build_unflags =
    -std=gnu++11

[env:esp32-power]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_POWER=1

[env:esp32-power-ttn]
; Same firmware reporting over The Things Network instead of a local broker.
extends = env:esp32-power
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_POWER=1
    -DRANCH_UPLINK_LORAWAN=1

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Werror -I../lib
src_filter = +<native/>
