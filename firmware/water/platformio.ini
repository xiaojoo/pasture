; 牧场水利控制板 · ESP32 DevKit V1
;
; Two independent water lines from one board: the barn dispensing on a timed
; programme, and the main house's line permanently available on its own command.
; The board drives the solenoids and the pump, meters flow on both lines, watches
; pressure and tank level, and refuses to let the pump run dry.
;
;   pio run -e esp32-water              # build for the shipping part
;   pio run -e esp32-water -t upload    # flash
;   pio device monitor                  # 115200
;   pio test -e native                  # host tests for firmware/lib

[platformio]
name = ranch-water
description = ESP32 ranch water distribution controller
default_envs = esp32-water

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Werror
    -DCORE_DEBUG_LEVEL=0
    -DRANCH_FW_VERSION=\"1.0.0\"
build_unflags =
    -std=gnu++11

[env:esp32-water]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_WATER=1
    -DARDUINO_USB_MODE=0

[env:esp32-water-rts]
; Same firmware for the board with an RS485 meter instead of the pulse meter.
extends = env:esp32-water
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_WATER=1
    -DRANCH_METER_RS485=1

[env:native]
; Host build of the platform-neutral logic (firmware/lib) only.
platform = native
build_flags = -std=c++17 -Wall -Werror -I../lib
src_filter = +<native/>
