; ESP32-S3 ranch inspection drone — companion computer
;
; The flight controller (ArduPilot/PX4 class) closes the rate and attitude
; loops. This firmware is the mission/video/telemetry computer: it speaks
; MAVLink to the FC, streams the camera, runs the waypoint mission, publishes
; state to the ground dashboard and enforces the failsafe table.
;
;   pio run -e esp32s3-drone            # build for the shipping part
;   pio run -e esp32s3-drone -t upload  # flash over USB-CDC
;   pio device monitor                  # 115200 8N1
;   pio test -e native                  # host unit tests for firmware/lib

[platformio]
name = ranch-drone
description = ESP32-S3 inspection drone companion computer
default_envs = esp32s3-drone

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Werror
    -DCORE_DEBUG_LEVEL=0
    -DRANCH_FW_VERSION=\"1.0.0\"
build_unflags =
    -std=gnu++11

[esp32_common]
platform = espressif32@6.12.0
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
lib_ldf_mode = chain+

[env:esp32s3-drone]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_DRONE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSIM_SKIP_ARM_CHECK  // for sim only: always assume ARM switch closed

[env:esp32-drone-wroom]
; Same firmware on the classic ESP32 (no PSRAM, smaller MJPEG buffers).
extends = esp32_common
board = esp32dev
build_flags =
    ${env.build_flags}
    -DRANCH_BOARD_DRONE=1
    -DRANCH_VIDEO_MAX_FRAME_KB=40

[env:native]
; Host build of the platform-neutral logic only. No Arduino sources are
; compiled here; test/test_logic.cpp pulls in firmware/lib headers.
platform = native
build_flags = -std=c++17 -Wall -Werror -I../lib
src_filter = +<*.cpp>
